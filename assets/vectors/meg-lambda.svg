<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" class="meg-lambda-wordmark" aria-label="Logotipo MEGλ">
  <style>
    .wordmark-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -2px;
      fill: currentColor;
    }
    .wordmark-stem {
      fill: currentColor;
    }
    .wordmark-leg {
      fill: var(--accent-primary, #d90429);
    }
  </style>

  <!-- Texto MEG -->
  <text x="10" y="62" class="wordmark-text">MEG</text>

  <!-- Lambda Modular alinhado como a letra A final -->
  <g transform="translate(162, 5) scale(0.66)">
    <polygon class="wordmark-stem" points="36,14 52,14 32,86 16,86" />
    <polygon class="wordmark-leg" points="51,44 67,44 84,86 68,86" />
  </g>
</svg>
