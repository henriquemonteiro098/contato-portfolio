<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none" class="hero-geometry-svg">
  <!-- Precision Wireframe & Minimalist Geometric Orbit -->
  <g opacity="0.85">
    <!-- Orbital Rings -->
    <circle cx="300" cy="300" r="240" stroke="currentColor" stroke-width="1" stroke-dasharray="8 6" opacity="0.3" />
    <circle cx="300" cy="300" r="180" stroke="currentColor" stroke-width="1.25" opacity="0.45" />
    <circle cx="300" cy="300" r="120" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="300" cy="300" r="60" stroke="currentColor" stroke-width="1.5" opacity="0.8" />
    
    <!-- Central Pivot Pulse -->
    <circle cx="300" cy="300" r="8" fill="currentColor" opacity="0.9" />
    <circle cx="300" cy="300" r="22" stroke="currentColor" stroke-width="1" opacity="0.5" />

    <!-- Isometric Vector Angles -->
    <line x1="60" y1="300" x2="540" y2="300" stroke="currentColor" stroke-width="1" opacity="0.25" />
    <line x1="300" y1="60" x2="300" y2="540" stroke="currentColor" stroke-width="1" opacity="0.25" />
    
    <!-- Diagonal Crossbeams (Golden Ratio Angles) -->
    <line x1="130" y1="130" x2="470" y2="470" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.35" />
    <line x1="130" y1="470" x2="470" y2="130" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.35" />

    <!-- Satellite Intersections -->
    <circle cx="215" cy="215" r="4" fill="currentColor" />
    <circle cx="385" cy="215" r="4" fill="currentColor" />
    <circle cx="215" cy="385" r="4" fill="currentColor" />
    <circle cx="385" cy="385" r="4" fill="currentColor" />

    <!-- Secondary Harmonic Curves -->
    <path d="M120 300 C120 180, 480 180, 480 300" stroke="currentColor" stroke-width="1" opacity="0.3" />
    <path d="M120 300 C120 420, 480 420, 480 300" stroke="currentColor" stroke-width="1" opacity="0.3" />
    <path d="M300 120 C180 120, 180 480, 300 480" stroke="currentColor" stroke-width="1" opacity="0.3" />
    <path d="M300 120 C420 120, 420 480, 300 480" stroke="currentColor" stroke-width="1" opacity="0.3" />
  </g>
</svg>
