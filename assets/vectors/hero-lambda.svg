<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" class="hero-lambda-svg" aria-label="Símbolo Lambda Monumental Minimalista">
  <defs>
    <!-- Brilho Ambiente Dinâmico -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent-glow)" stop-opacity="0.18" />
      <stop offset="50%" stop-color="var(--accent-glow)" stop-opacity="0.06" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
    
    <!-- Filtro de Sombra Suave e Glow para a Perna Modular -->
    <filter id="accentGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="var(--accent-glow)" flood-opacity="0.25" />
    </filter>

    <!-- Gemini Shimmer Contínuo para a Perna do Hero (Modo Claro) -->
    <linearGradient id="heroLambdaShimmerLight" x1="0%" y1="0%" x2="160%" y2="160%">
      <stop offset="0%" stop-color="#523402" />
      <stop offset="12%" stop-color="#a67405" />
      <stop offset="22%" stop-color="#f5c53a" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#fff4be" />
      <stop offset="38%" stop-color="#c88a04" />
      <stop offset="50%" stop-color="#523402" />
      <stop offset="62%" stop-color="#a67405" />
      <stop offset="72%" stop-color="#f5c53a" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="78%" stop-color="#fff4be" />
      <stop offset="88%" stop-color="#c88a04" />
      <stop offset="100%" stop-color="#523402" />
      <animate attributeName="x1" from="0%" to="-80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="y1" from="0%" to="-80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="x2" from="160%" to="80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="y2" from="160%" to="80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
    </linearGradient>

    <!-- Gemini Shimmer Contínuo para a Perna do Hero (Modo Escuro) -->
    <linearGradient id="heroLambdaShimmerDark" x1="0%" y1="0%" x2="160%" y2="160%">
      <stop offset="0%" stop-color="#2a0005" />
      <stop offset="12%" stop-color="#80000e" />
      <stop offset="22%" stop-color="#e60012" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="28%" stop-color="#ff7385" />
      <stop offset="38%" stop-color="#990012" />
      <stop offset="50%" stop-color="#2a0005" />
      <stop offset="62%" stop-color="#80000e" />
      <stop offset="72%" stop-color="#e60012" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="78%" stop-color="#ff7385" />
      <stop offset="88%" stop-color="#990012" />
      <stop offset="100%" stop-color="#2a0005" />
      <animate attributeName="x1" from="0%" to="-80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="y1" from="0%" to="-80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="x2" from="160%" to="80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
      <animate attributeName="y2" from="160%" to="80%" dur="10s" repeatCount="indefinite" calcMode="linear" />
    </linearGradient>
  </defs>

  <!-- Halo de Fundo -->
  <circle cx="300" cy="300" r="260" fill="url(#heroGlow)" />

  <!-- Grid Blueprint Técnico & Órbitas Concéntricas -->
  <g class="blueprint-grid" stroke="currentColor" opacity="0.22" fill="none">
    <circle cx="300" cy="300" r="250" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
    <circle cx="300" cy="300" r="190" stroke-width="1.2" opacity="0.6" />
    <circle cx="300" cy="300" r="130" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
    <circle cx="300" cy="300" r="70" stroke-width="1.5" opacity="0.7" />

    <line x1="50" y1="300" x2="550" y2="300" stroke-width="1" opacity="0.35" />
    <line x1="300" y1="50" x2="300" y2="550" stroke-width="1" opacity="0.35" />
    
    <line x1="120" y1="120" x2="480" y2="480" stroke-width="1" stroke-dasharray="4 8" opacity="0.2" />
    <line x1="120" y1="480" x2="480" y2="120" stroke-width="1" stroke-dasharray="4 8" opacity="0.2" />

    <path d="M 60 90 L 60 60 L 90 60" stroke-width="1.5" opacity="0.6" />
    <path d="M 540 90 L 540 60 L 510 60" stroke-width="1.5" opacity="0.6" />
    <path d="M 60 510 L 60 540 L 90 540" stroke-width="1.5" opacity="0.6" />
    <path d="M 540 510 L 540 540 L 510 540" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Lambda Desconstruído Central -->
  <g class="hero-lambda-core">
    <polygon class="hero-lambda-stem" points="230,120 310,120 210,480 130,480" fill="#121214" />
    <polygon class="hero-lambda-leg" points="305,270 385,270 470,480 390,480" fill="url(#heroLambdaShimmerLight)" filter="url(#accentGlowFilter)" />
  </g>

  <!-- Marcadores Técnicos & Coordenadas -->
  <g class="technical-markers" fill="currentColor" opacity="0.55">
    <circle cx="270" cy="120" r="3.5" />
    <circle cx="170" cy="480" r="3.5" />
    <circle cx="345" cy="270" r="3.5" />
    <circle cx="430" cy="480" r="3.5" />
  </g>
</svg>
