<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanline { 0% { transform: translateY(-500px); } 100% { transform: translateY(500px); } }
    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.3; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(0.95); opacity: 0.3; } }
    @keyframes floatClapper { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-1deg); } 100% { transform: translateY(0px) rotate(0deg); } }
    @keyframes lightBeam { 0% { opacity: 0.15; transform: rotate(-5deg); } 50% { opacity: 0.45; transform: rotate(5deg); } 100% { opacity: 0.15; transform: rotate(-5deg); } }
    .scan-line { animation: scanline 4s linear infinite; }
    .pulse-elem { transform-origin: center; animation: pulseRing 3.5s ease-in-out infinite; }
    .float-elem { transform-origin: center; animation: floatClapper 5s ease-in-out infinite; }
    .beam { transform-origin: 400px 50px; animation: lightBeam 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Cinema Light Cone Beam -->
  <polygon points="400,40 100,500 700,500" fill="url(#glow1)" opacity="0.12" class="beam"/>

  <!-- Grid Perspective Lines -->
  <g stroke="#00ffaa" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="475" x2="800" y2="475"/>
    <line x1="100" y1="500" x2="350" y2="350"/>
    <line x1="250" y1="500" x2="380" y2="350"/>
    <line x1="700" y1="500" x2="450" y2="350"/>
    <line x1="550" y1="500" x2="420" y2="350"/>
  </g>

  <!-- Camera / Lens Ring -->
  <g class="float-elem">
    <!-- Outer Focus Ring -->
    <circle cx="400" cy="240" r="140" fill="none" stroke="#222e2a" stroke-width="8"/>
    <circle cx="400" cy="240" r="140" fill="none" stroke="#00ffaa" stroke-width="2" stroke-dasharray="16 12" class="pulse-elem"/>
    <circle cx="400" cy="240" r="105" fill="#0b1613" stroke="#00ffaa" stroke-width="3" filter="url(#blur1)" opacity="0.9"/>
    
    <!-- Anamorphic Lens Flare Line -->
    <line x1="150" y1="240" x2="650" y2="240" stroke="#00ffaa" stroke-width="2" opacity="0.6" filter="url(#blur1)"/>
    <circle cx="400" cy="240" r="60" fill="#030807" stroke="#00ffaa" stroke-width="1.5"/>
    <circle cx="400" cy="240" r="28" fill="#00ffaa" opacity="0.8" filter="url(#blur1)"/>

    <!-- Viewfinder HUD Elements -->
    <path d="M 330 170 L 320 170 L 320 180" fill="none" stroke="#00ffaa" stroke-width="2"/>
    <path d="M 470 170 L 480 170 L 480 180" fill="none" stroke="#00ffaa" stroke-width="2"/>
    <path d="M 330 310 L 320 310 L 320 300" fill="none" stroke="#00ffaa" stroke-width="2"/>
    <path d="M 470 310 L 480 310 L 480 300" fill="none" stroke="#00ffaa" stroke-width="2"/>

    <!-- REC dot -->
    <circle cx="340" cy="195" r="5" fill="#ff3366"/>
    <text x="354" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">REC 4K</text>
    <text x="430" y="200" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">24.00 FPS</text>
  </g>

  <!-- Technical Telemetry Labels -->
  <text x="50" y="70" fill="#556b62" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3">AI_PIPELINE // PROMPT_ENG</text>
  <text x="50" y="90" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.7">ANAMORPHIC_RATIO : 2.39:1</text>
  
  <text x="590" y="70" fill="#556b62" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3">ISO 800 // T1.5</text>
  <text x="640" y="90" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.7">LATENCY: 12ms</text>

  <!-- Cinematic Scanline -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00ffaa" stroke-width="1.5" opacity="0.25" class="scan-line"/>
</svg>
