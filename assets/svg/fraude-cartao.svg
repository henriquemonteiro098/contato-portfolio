<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Black & Void -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>

    <!-- Emerald Matrix / Shield Gradient -->
    <linearGradient id="shieldEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Threat Alert Glow -->
    <filter id="threatGlow">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepAngle { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseShield { 0% { transform: scale(0.98); opacity: 0.85; } 50% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(0.98); opacity: 0.85; } }
    @keyframes dataStream { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
    @keyframes alertBlink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes matrixRain { 0% { transform: translateY(-50px); opacity: 0; } 50% { opacity: 0.7; } 100% { transform: translateY(150px); opacity: 0; } }
    
    .scanner { transform-origin: 400px 245px; animation: sweepAngle 4.5s linear infinite; }
    .shield-body { transform-origin: 400px 245px; animation: pulseShield 3.5s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 8; animation: dataStream 1.5s linear infinite; }
    .alert-dot { animation: alertBlink 1.8s infinite; }
    .matrix-drop1 { animation: matrixRain 3s linear infinite; }
    .matrix-drop2 { animation: matrixRain 3.5s linear infinite 0.7s; }
  </style>

  <!-- Deep Background -->
  <rect width="800" height="500" fill="url(#cyberBg)"/>

  <!-- Hexagonal Security Mesh / Grid Pattern -->
  <g stroke="#00ffaa" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="245" x2="800" y2="245"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Radar Scope Rings -->
  <circle cx="400" cy="245" r="190" fill="none" stroke="#0e2336" stroke-width="1.5"/>
  <circle cx="400" cy="245" r="140" fill="none" stroke="#163956" stroke-width="1.5" stroke-dasharray="10 8"/>
  <circle cx="400" cy="245" r="85" fill="none" stroke="#00ffaa" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Scanning Conical Radar Sweeper -->
  <g class="scanner">
    <path d="M 400 245 L 590 245 A 190 190 0 0 0 400 55 Z" fill="url(#shieldEmerald)" opacity="0.12"/>
    <line x1="400" y1="245" x2="590" y2="245" stroke="#00ffaa" stroke-width="2" filter="url(#emeraldGlow)"/>
  </g>

  <!-- Central Heavy Cyber Shield Armor -->
  <g class="shield-body">
    <!-- Outer Shield Silhouette -->
    <path d="M 400 135 L 485 175 L 485 270 C 485 330 400 375 400 375 C 400 375 315 330 315 270 L 315 175 Z" 
          fill="#081018" stroke="#00ffaa" stroke-width="2.5" filter="url(#emeraldGlow)" opacity="0.95"/>

    <!-- Inner Shield Layer -->
    <path d="M 400 155 L 465 188 L 465 262 C 465 310 400 348 400 348 C 400 348 335 310 335 262 L 335 188 Z" 
          fill="#0c1824" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Integrated Cyber Padlock & Cryptographic Core -->
    <!-- Shackle -->
    <path d="M 380 230 L 380 205 C 380 193 420 193 420 205 L 420 230" fill="none" stroke="#00ffaa" stroke-width="3" stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="368" y="225" width="64" height="48" rx="8" fill="#132435" stroke="#00ffaa" stroke-width="2"/>
    <circle cx="400" cy="245" r="5" fill="#00ffaa" filter="url(#emeraldGlow)"/>
    <line x1="400" y1="250" x2="400" y2="260" stroke="#00ffaa" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Binary Matrix Nodes inside Shield -->
    <text x="355" y="305" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="9" opacity="0.7">AES_256 // ENCRYPTED</text>
  </g>

  <!-- Real-time Intercepted Anomaly Ping (Red Alert) -->
  <g>
    <circle cx="560" cy="180" r="18" fill="#ff2255" opacity="0.18" class="alert-dot"/>
    <circle cx="560" cy="180" r="5" fill="#ff2255" filter="url(#threatGlow)"/>
    <rect x="580" y="168" width="135" height="34" rx="6" fill="#1a0a10" stroke="#ff2255" stroke-width="1.2"/>
    <text x="590" y="183" fill="#ff2255" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">THREAT INTERCEPTED</text>
    <text x="590" y="195" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8">FRAUD PROB: 99.8%</text>
  </g>

  <!-- Network Circuit Stream Lines -->
  <path d="M 80 410 L 220 410 L 290 350 L 400 420 L 510 350 L 580 410 L 720 410" fill="none" stroke="#00ffaa" stroke-width="1.5" class="stream-line" opacity="0.7"/>
  <circle cx="80" cy="410" r="4" fill="#00ffaa"/>
  <circle cx="220" cy="410" r="3.5" fill="#00ffaa"/>
  <circle cx="400" cy="420" r="5" fill="#00e5ff" filter="url(#emeraldGlow)"/>
  <circle cx="580" cy="410" r="3.5" fill="#00ffaa"/>
  <circle cx="720" cy="410" r="4" fill="#00ffaa"/>

  <!-- Top Telemetry HUD -->
  <text x="50" y="65" fill="#4d6b82" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">ZERO_TRUST // ANOMALY_DETECTOR</text>
  <text x="50" y="85" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">RANDOM_FOREST + XGBOOST // SMOTE BALANCED</text>

  <text x="590" y="65" fill="#4d6b82" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">FIREWALL: ACTIVE</text>
  <text x="640" y="85" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">LATENCY: 4.2ms</text>
</svg>
