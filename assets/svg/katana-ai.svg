<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090807"/>
      <stop offset="50%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ffaa"/>
      <stop offset="70%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="bladeGlow">
      <feGaussianBlur stdDeviation="7" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes slashGlitch { 0% { stroke-dashoffset: 800; opacity: 0.4; } 50% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -800; opacity: 0.4; } }
    @keyframes pulseHilt { 0% { transform: scale(0.97); } 50% { transform: scale(1.03); } 100% { transform: scale(0.97); } }
    .slash { stroke-dasharray: 400; animation: slashGlitch 3.5s ease-in-out infinite; }
    .samurai-core { transform-origin: 400px 240px; animation: pulseHilt 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg5)"/>

  <!-- Dramatic Katana Slash Energy Line -->
  <line x1="80" y1="420" x2="720" y2="80" stroke="url(#bladeGrad)" stroke-width="4" filter="url(#bladeGlow)" class="slash"/>
  <line x1="70" y1="425" x2="710" y2="85" stroke="#00ffaa" stroke-width="1.5" opacity="0.6"/>

  <!-- Golden Sun / Cyber Moon Background (Wong Kar Wai & Akira vibes) -->
  <circle cx="400" cy="240" r="130" fill="none" stroke="#2b201a" stroke-width="1.5"/>
  <circle cx="400" cy="240" r="100" fill="#17110c" stroke="#ff4500" stroke-width="1" opacity="0.3"/>

  <!-- Blade Crossguard & Cyber Core -->
  <g class="samurai-core">
    <!-- Traditional Octagonal Tsuba (Crossguard) -->
    <polygon points="360,200 440,200 460,240 440,280 360,280 340,240" fill="#0d0a08" stroke="#00ffaa" stroke-width="2" filter="url(#bladeGlow)"/>
    <circle cx="400" cy="240" r="16" fill="#ff3b00" opacity="0.8"/>
    <circle cx="400" cy="240" r="8" fill="#ffffff"/>

    <!-- Kanji / Lambda Signature -->
    <text x="390" y="247" fill="#00ffaa" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic">λ</text>
  </g>

  <!-- Typography & Cinematic Metadata -->
  <text x="400" y="360" text-anchor="middle" fill="#d6c5b8" font-family="'Syne', sans-serif" font-size="16" font-weight="bold" letter-spacing="4">MEGλ DIRECTORS CUT</text>
  <text x="400" y="385" text-anchor="middle" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">HIGGSFIELD AI // KLING DIFFUSION 2.0</text>

  <!-- Telemetry Header -->
  <text x="50" y="70" fill="#5c4538" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3">VISUAL_ENGINE // GENERATIVE_ART</text>
  <text x="50" y="90" fill="#ff4500" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">STYLE: CYBERPUNK NEO-NOIR</text>

  <text x="590" y="70" fill="#5c4538" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3">FPS: 60 // 4K 10-BIT</text>
  <text x="630" y="90" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">SAMPLING: EULER</text>
</svg>
